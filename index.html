<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>川崎ECCトレーニングサイト CCF計測器 ver2.0</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/qr.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#228b22" />
</head>

<body>
  <div class="app">
    <header>
      <span class="title">CCF計測器 <small>ver2.0</small></span>
      <div class="header-buttons">
        <button type="button" id="button-qr">QR</button>
        <button type="button" id="button-reset">リセット</button>
      </div>
    </header>

    <div id="status-banner" class="banner tone-neutral">
      <span id="status-text">心停止の認識を待っています</span>
      <span id="live-gap" class="num"></span>
    </div>

    <div id="ccf-block" class="ccf">
      <div><span id="ccf-value" class="num">0</span><span class="ccf-unit">%</span></div>
      <span id="ccf-rating"></span>
    </div>
    <p id="legend" class="legend"></p>

    <dl class="times">
      <div><dt>心停止時間</dt><dd id="time-arrest" class="num">0:00</dd></div>
      <div><dt>胸骨圧迫時間</dt><dd id="time-compression" class="num">0:00</dd></div>
    </dl>

    <section class="log-area">
      <p id="log-summary"></p>
      <ol id="log" class="num"></ol>
    </section>

    <div class="controls">
      <button type="button" id="button-finish" hidden>終了（ROSC・蘇生中止）</button>
      <div id="main-row" class="main-row">
        <button type="button" id="button-main" class="tone-arrest">心停止認識</button>
        <button type="button" id="button-defib" hidden><span id="defib-label">初回除細動</span><span id="defib-elapsed" class="num"></span></button>
      </div>
      <div id="result-row" class="result-row" hidden>
        <button type="button" id="button-result-qr">結果のQR</button>
        <button type="button" id="button-share">結果を共有</button>
      </div>
    </div>
  </div>

  <div id="qr-overlay" class="qr-overlay" data-opener="button-qr" role="dialog" aria-modal="true" aria-label="このページの QR コード" hidden>
    <p class="qr-heading">このページの QR コード</p>
    <!-- QR コードの画像と URL は src/make_qr.py で作る（手で書き換えない） -->
    <!-- qr:begin -->
    <img class="qr-image" width="37" height="37" alt="QR コード：https://keiimai.github.io/kwskCCF/"
      src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACUAAAAlAQAAAADt5R2uAAAArklEQVR42mP4DwQ/GDDJD4JPHSoYvt+aeL+C4UuQYyCQjIy8CCTjeIHk94vv4ysYPoiGAtX8/+1a/4Ph6wmxtxUMf8yl/IDiHO8KgSrfL938g+FzhKk/kP3uFVD8T3ibeAXD762u5kBb4tjOVzD8LJrkU8HwcfabzUDZn2vXA+0NXc4ElP3yFWjCBxH+cJAbfMqBJsSzMYHIKSCTA3zNgOJ3epmB6oW+a1cw4PAFAHv6fLylm0JZAAAAAElFTkSuQmCC" />
    <p class="qr-url">https://keiimai.github.io/kwskCCF/</p>
    <!-- qr:end -->
    <p class="qr-trademark">QRコードは株式会社デンソーウェーブの登録商標です</p>
    <button type="button" class="qr-close">閉じる</button>
  </div>

  <div id="result-overlay" class="qr-overlay" data-opener="button-result-qr" role="dialog" aria-modal="true" aria-label="結果の QR コード" hidden>
    <p class="qr-heading">結果の QR コード</p>
    <canvas id="result-qr" class="qr-image" role="img" aria-label="結果ページを開く QR コード"></canvas>
    <p class="qr-note">iPad などのカメラで読み取ると、<br />大きな画面で結果が開きます。</p>
    <p class="qr-trademark">QRコードは株式会社デンソーウェーブの登録商標です</p>
    <button type="button" class="qr-close">閉じる</button>
  </div>

  <div id="share-overlay" class="qr-overlay" role="dialog" aria-modal="true" aria-label="結果のリンク" hidden>
    <p class="qr-heading">結果のリンク</p>
    <p id="share-message" class="qr-note"></p>
    <input type="text" id="share-url" class="share-url qr-keep" readonly aria-label="結果のリンク" />
    <button type="button" class="qr-close">閉じる</button>
  </div>

  <script src="js/timer.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/offline.js"></script>
</body>
</html>
